apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: 1pro/exam
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_USER
              value: 1pro
            - name: REDIS_DB
              value: ckad
            - name: REDIS_PASSSWORD
              value: ckad123