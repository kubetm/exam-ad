apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      serviceAccountName: default
      containers:
        - name: server
          image: bitnami/kubectl
          command: ["sh", "-c", "while true; do kubectl get pods -n beta; sleep 10; done"]