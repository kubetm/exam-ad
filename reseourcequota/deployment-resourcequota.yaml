apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-resources
  namespace: resources
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80