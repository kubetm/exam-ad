apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: rollout2
spec:
  replicas: 1
  selector:
    matchLabels:
      name: app
  template:
    metadata:
      labels:
        name: app
    spec:
      containers:
        - name: app
          image: 1pro/exam:1.0
          ports:
            - containerPort: 8080